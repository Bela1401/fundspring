  <text x="80" y="307" fill="#f5f7f3" font-family="Georgia, serif" font-size="76" font-weight="600">Community Launch</text>
  <text x="82" y="370" fill="#a7b0a9" font-family="Arial, sans-serif" font-size="27">Transparent USDC crowdfunding · Built on Arc</text>
