<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">FundSpring Community Launch</title>
  <desc id="description">Abstract green growth rings for FundSpring, an independent crowdfunding application built on Arc.</desc>
  <defs>
    <radialGradient id="glow" cx="70%" cy="30%" r="70%">
      <stop offset="0" stop-color="#bef264" stop-opacity=".28"/>
      <stop offset="1" stop-color="#07110d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#34d399"/>
      <stop offset="1" stop-color="#bef264"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#07110d"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g fill="none" stroke="url(#line)" stroke-opacity=".32">
    <circle cx="940" cy="170" r="110"/>
    <circle cx="940" cy="170" r="190"/>
    <circle cx="940" cy="170" r="280"/>
    <circle cx="940" cy="170" r="380"/>
  </g>
  <rect x="78" y="72" width="58" height="58" rx="16" fill="#bef264"/>
